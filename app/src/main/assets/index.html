<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src 'none';"><title>UNI-T — Онлайн-інструкція</title><style>
*{box-sizing:border-box}body{margin:0;background:#17181c;color:#f5f5f5;font:16px system-ui,sans-serif}header{padding:14px 18px;background:#212226;text-align:center;border-bottom:1px solid #35363d}header b{font-size:32px;letter-spacing:1px;color:#ff4c4c}header h1{font-size:17px;margin:4px 0}header small,.muted{color:#b4b6bf}main{max-width:640px;margin:auto;padding:12px 14px 84px}button,a.action{font:inherit;color:inherit;background:#2b2c32;border:1px solid #41434b;border-radius:12px;padding:12px;cursor:pointer;min-height:46px;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ff7373}button.tile{width:100%;display:flex;align-items:center;gap:12px;text-align:left;margin:7px 0;font-weight:650;font-size:14px}button.tile span:first-child{width:32px;text-align:center;font-size:23px;color:#ff6262}button.tile span:last-child{margin-left:auto;color:#b4b6bf}.hero{display:flex;align-items:center;justify-content:center;gap:20px;background:linear-gradient(135deg,#353138,#211e24);border:1px solid #474049;border-radius:16px;padding:12px;margin-bottom:12px}.hero svg{height:108px;width:86px}.hero strong{font-size:24px}.hero p{font-size:13px;line-height:1.5;margin:4px 0}.search{width:100%;font:inherit;border-radius:12px;border:1px solid #555760;background:#222329;color:#fff;padding:12px;margin-bottom:8px}nav{position:fixed;bottom:0;left:0;right:0;background:#232429;border-top:1px solid #444;display:flex;justify-content:center;padding:6px;gap:5px}nav button{flex:1;max-width:160px;font-size:12px;background:transparent;border:0;padding:8px 3px}nav span{display:block;font-size:21px}h2{font-size:23px;margin:16px 0}h3{font-size:17px;margin:0 0 9px}.panel{background:#25262b;border:1px solid #3c3d45;border-radius:13px;padding:15px;margin:10px 0;line-height:1.55}.panel p{margin:7px 0}.panel ol{padding-left:22px;margin:8px 0}.panel li{margin:5px 0}.warn{border-left:4px solid #ff9a48;background:#322a24}.red{background:#b92c31;border-color:#e44a4a}.star{float:right;padding:6px 10px;min-height:36px;color:#fbc55e}a{color:#ff9696;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:8px;border-bottom:1px solid #444}img.preview{width:100%;max-height:400px;object-fit:contain}input[type=file]{width:100%;color:#ddd}footer{font-size:12px;color:#a6a8ae;text-align:center;margin-top:16px}button.back{font-size:14px}small{line-height:1.4} .meta{font-size:12px;color:#c7c8ce}
</style></head><body><header><b>UNI-T</b><h1>ОНЛАЙН-ІНСТРУКЦІЯ</h1><small>UTi260B • Професійний довідник</small></header><main id="main"></main><nav aria-label="Меню"><button onclick="go('home')"><span>⌂</span>Головна</button><button onclick="go('search')"><span>⌕</span>Пошук</button><button onclick="go('saved')"><span>☆</span>Обране</button><button onclick="go('settings')"><span>⚙</span>Параметри</button><button onclick="exitGuide()"><span>↪</span>Вихід</button></nav><script>
const manual='https://storage.googleapis.com/uni-tdocuments/Thermal%20Camera%20User%20Manuals/UTi260B_User_Manual.pdf';
const categories=[['device','▣','ІНСТРУКЦІЯ КОРИСТУВАЧА'],['config','⚙','НАЛАШТУВАННЯ ПРИЛАДУ'],['electric','ϟ','ЕЛЕКТРОДІАГНОСТИКА'],['house','⌂','ОБСТЕЖЕННЯ БУДИНКІВ'],['floor','≋','ТЕПЛА ПІДЛОГА'],['reference','▤','ПРОФЕСІЙНИЙ ДОВІДНИК'],['photo','▧','ПЕРЕДАЧА ФОТО'],['fault','⚒','НЕСПРАВНОСТІ ПРИЛАДУ'],['video','▶','ОНЛАЙН-МАТЕРІАЛИ']];
// Each entry: category, stable ID, title, steps, note. Original practical guidance is not a substitute for the manufacturer manual.
const articles=[
['device','d1','Підготовка до роботи',['Перевірте корпус, лінзу, заряд і наявність карти пам’яті.','Увімкніть прилад і дочекайтеся стабільного зображення.','Після тривалого простою перед точними вимірюваннями дайте приладу приблизно 20 хвилин на прогрів.'],'Не вимірюйте під час або відразу після заряджання.'],
['device','d2','Кнопки та керування',['Кнопка живлення — запуск і вимкнення.','SET підтверджує вибір; стрілки переміщують між параметрами.','Кнопка повернення виходить із меню; курок захоплює кадр; кнопка перегляду відкриває галерею.'],'Розташування кнопок перевіряйте за ілюстрацією в оригінальному посібнику.'],
['device','d3','Паспортні характеристики',['ІЧ матриця: 256 × 192 пікселів.','Дисплей: 2,8 дюйма.','USB Type-C, microSD, видима камера 640 × 480.','Верхня межа вимірювання: 550 °C.'],'Нижня межа та характеристики можуть залежати від ревізії. Звіряйте з документацією свого екземпляра.'],
['device','d4','Збереження та перегляд термограм',['Натисніть курок, збережіть кадр через SET у ручному режимі.','Для перегляду відкрийте галерею і виберіть зображення.','Зберігайте одночасно оглядове фото місця дефекту.'],'Для запису термограм потрібна встановлена microSD.'],
['config','c1','Коефіцієнт випромінювання (ε)',['Відкрийте Settings → Measurements.','Виберіть Emissivity, задайте значення для матеріалу і підтвердьте.','Для різних поверхонь перевіряйте значення окремо.'],'Блискучі метали відбивають теплове випромінювання; покази можуть бути оманливими.'],
['config','c2','Температура середовища та відстань',['У меню Measurements установіть фактичні параметри середовища і дистанцію до об’єкта.','Перевірте, що ціль достатньо велика відносно поля вимірювання.','Запишіть параметри разом із результатами.'],'Не використовуйте однакові налаштування автоматично для всіх об’єктів.'],
['config','c3','Палітра і режим зображення',['Підберіть палітру для розрізнення температурних зон.','Порівнюйте кадри з однаковим температурним діапазоном.','Використовуйте видиме зображення або накладання для локалізації.'],'Колір не є температурою без шкали.'],
['config','c4','USB Disk / USB Camera',['Settings → USB Mode.','USB Disk — доступ до записаних файлів; USB Camera — передавання зображення до сумісного ПЗ ПК.','Виберіть режим і підтвердьте SET.'],'Пряме підключення до Android не підтверджене виробником.'],
['config','c5','Автозбереження й автовимкнення',['У System Settings знайдіть Auto Save.','Налаштуйте автоматичне збереження, якщо потрібна серія кадрів.','У Auto Power Off виберіть зручний час вимкнення.'],'Форматування карти видаляє дані. Спершу зробіть резервну копію.'],
['electric','e1','Безпечне обстеження електрощита',['Обстежуйте лише доступні зовні поверхні.','Зафіксуйте навантаження та умови роботи.','Зробіть загальний і деталізований кадри.'],'Відкривати щит під напругою та працювати біля струмовідних частин має тільки кваліфікований персонал.'],
['electric','e2','Перегрів автоматів і контактів',['Зіставте однакові компоненти за співставного струму та умов.','Перевірте локальність аномалії, відблиски та температуру контрольної точки.','Запишіть температуру, різницю та навантаження.'],'Не підтягувати контакти під напругою. Гранична температура залежить від типу обладнання та вимог виробника.'],
['electric','e3','Розетки, вилки і клеми',['Оцініть корпус та зону входу проводу.','Порівняйте з аналогічним навантаженим виробом.','Зафіксуйте потемніння, запах, деформацію або локальний перегрів.'],'За ознак горіння припиніть використання і забезпечте безпечне відключення.'],
['house','h1','Підготовка будинку',['Зафіксуйте внутрішню та зовнішню температуру, вітер, опади і сонячне опромінення.','Бажано мати стабільну різницю температур між приміщенням і вулицею.','Уникайте висновків одразу після провітрювання чи локального нагрівання.'],'Одна термограма не визначає коефіцієнт теплопередачі.'],
['house','h2','Стіни, кути та містки холоду',['Зробіть загальний кадр і кадр аномальної зони.','Зіставте її з сусідньою однотипною ділянкою.','Перевірте геометрію, вологість та можливі повітряні потоки.'],'Холодна зона може мати кілька причин; потрібне додаткове підтвердження.'],
['house','h3','Вікна і двері',['Обстежте примикання, укоси, ущільнення та нижню частину рами.','Перевірте вплив радіаторів і відображення на склі.','Зафіксуйте місце аномалії на звичайній фотографії.'],'Не вимірюйте температуру за склом тепловізором.'],
['floor','f1','Контури теплої підлоги',['Зафіксуйте початковий стан поверхні.','Після запуску спостерігайте зміну температурного рисунка.','Порівняйте сусідні контури та повторіть знімок після стабілізації.'],'Візерунок залежить від покриття, глибини труб і часу роботи.'],
['floor','f2','Холодна ділянка',['Перевірте налаштування термостата та стан системи.','Порівняйте однотипні ділянки без килимів та меблів.','Передайте результати профільному спеціалісту для перевірки циркуляції або електричного контуру.'],'Не розкривайте підлогу лише за термограмою.'],
['reference','r1','Як читати термограму',['Знайдіть шкалу температур і точки вимірювання.','Зіставте термограму з видимим кадром та умовами вимірювання.','Порівняйте тільки співставні поверхні і навантаження.'],'Автоматична палітра може змінювати колір при незмінній температурі.'],
['reference','r2','Різниця температур ΔT',['Визначте температуру зони інтересу.','Оберіть контрольну точку на аналогічній поверхні в аналогічних умовах.','Відніміть контрольну температуру від температури зони.'],'ΔT не є універсальним критерієм аварійності.'],
['reference','r3','Що записати у звіт',['Дата, місце, модель приладу, умови.','Номер термограми, об’єкт, температура, контрольна точка.','Спостереження, імовірна причина, рекомендована додаткова перевірка.'],'Відокремлюйте виміряний факт від припущення.'],
['photo','p1','Передача через ПК',['Установіть офіційне ПЗ UTi Thermal Analyzer на сумісний ПК.','Підключіть тепловізор кабелем даних у режимі USB Disk.','Скопіюйте файли на ПК, а потім на телефон.'],'Зберігайте оригінали BMP; не перезаписуйте їх конвертованими зображеннями.'],
['photo','p2','Передача через microSD / OTG',['Вимкніть тепловізор перед вийманням microSD.','Вставте карту у сумісний USB-C кардридер або OTG-адаптер.','Відкрийте системний файловий менеджер і скопіюйте файли.'],'Спосіб залежить від підтримки USB Host і файлової системи телефоном.'],
['photo','p3','Телефон не бачить тепловізор',['Перевірте режим USB Disk та кабель передачі даних.','Перевірте OTG на телефоні відомим справним пристроєм.','Якщо накопичувач не з’являється, використайте кардридер або ПК.'],'Заряджання через кабель не означає, що передача даних працює.'],
['fault','x1','Екран коротко засвічується і гасне',['Перевірте заряджання рекомендованим адаптером та справним кабелем.','Від’єднайте кабель, спробуйте звичайне увімкнення.','Якщо симптом повторюється, зверніться до сервісу.'],'Показник 99% не виключає несправність живлення. Не розбирайте літієвий акумулятор.'],
['fault','x2','Не зберігаються фото',['Перевірте наявність карти та вільний обсяг.','Перевірте збереження в ручному режимі.','Зробіть резервну копію перед будь-яким форматуванням.'],'Не виймайте карту під час запису.'],
['fault','x3','Нестабільні покази температури',['Дочекайтеся стабілізації приладу.','Перевірте коефіцієнт випромінювання, відстань і відблиски.','Порівняйте з контрольним вимірюванням, якщо це можливо.'],'За підозри на пошкодження припиніть використання для відповідальних вимірювань.']
];
let page='home',query='',saved=[];try{saved=JSON.parse(localStorage.getItem('unit.saved')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){};const main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const button=(id,icon,title)=>`<button class="tile" onclick="go('${id}')"><span>${icon}</span>${esc(title)}<span>›</span></button>`;
const back='<button class="back" onclick="go(\'home\')">← Головна</button>';
function article(a){return `<section class="panel"><button class="star" aria-label="Обране" onclick="toggle('${a[1]}',this)">${saved.includes(a[1])?'★':'☆'}</button><h3>${esc(a[2])}</h3><ol>${a[3].map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="meta">Важливо: ${esc(a[4])}</p></section>`}
function toggle(id,b){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem('unit.saved',JSON.stringify(saved))}catch(e){};if(page==='saved')render();else b.textContent=saved.includes(id)?'★':'☆'}
function go(p){page=p;query='';render();window.scrollTo(0,0)}
window.guideBack=()=>{if(page==='home')exitGuide();else go('home')};
function exitGuide(){if(window.GuideApp)GuideApp.exit();else go('home')}
function search(v){query=v;document.getElementById('results').innerHTML=results()}
function results(){let q=query.trim().toLocaleLowerCase('uk');let m=articles.filter(a=>a.slice(2).flat().join(' ').toLocaleLowerCase('uk').includes(q));return `<p class="meta">Знайдено: ${m.length}</p>`+m.map(article).join('')}
function extras(p){if(p==='reference')return `<section class="panel"><h3>Орієнтовна випромінювальна здатність</h3><table><tr><th>Поверхня</th><th>ε</th></tr>${[['Фарбована поверхня','0,90'],['Гума','0,95'],['ПВХ','0,93'],['Бетон','0,97'],['Окиснена мідь','0,78'],['Мідна пластина','0,06']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table><p class="meta">Орієнтири з посібника UTi260B. Фактичне значення залежить від стану, покриття та температури поверхні.</p></section>`;if(p==='photo')return `<section class="panel"><h3>Перегляд фотографії</h3><p>Виберіть файл, доступний у системному сховищі телефону. Це перегляд зображення, не аналіз радіометричних даних.</p><input type="file" accept="image/*,.bmp" onchange="preview(this)"><p id="fileinfo" class="meta"></p><img id="preview" class="preview" alt="Попередній перегляд" hidden></section>`;if(p==='video')return `<section class="panel"><h3>Документація виробника</h3><p><a href="${manual}">Оригінальна інструкція UTi260B (PDF, англійською)</a></p><p><a href="https://uni-tnm.com/product/meter/html/UTi260B.html">Паспорт і документація приладу</a></p><p><a href="https://www.youtube.com/watch?v=Bj6bNuhREtU">Відео: огляд UTi260B</a></p><p class="meta">Для відкриття посилань потрібен інтернет.</p></section>`;return ''}
let objUrl=null;function preview(input){let f=input.files[0];if(!f)return;if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(f);let img=document.getElementById('preview');img.hidden=false;img.onerror=()=>{img.hidden=true;document.getElementById('fileinfo').textContent='Не вдалося відкрити формат зображення. Збережіть оригінал; спробуйте перегляд на ПК.'};document.getElementById('fileinfo').textContent=f.name+' • '+Math.round(f.size/1024)+' КБ';img.src=objUrl}
function render(){if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}if(page==='home'){main.innerHTML=`<div class="hero"><svg viewBox="0 0 100 130" role="img" aria-label="Умовна ілюстрація тепловізора"><rect x="20" y="3" width="62" height="83" rx="10" fill="#d73539"/><rect x="26" y="10" width="50" height="53" rx="5" fill="#1b1b22"/><rect x="30" y="14" width="42" height="45" fill="#772396"/><path d="M30 53L43 26 53 47 63 20 72 46V59H30Z" fill="#ff7b19"/><circle cx="51" cy="42" r="7" fill="#ffef6b"/><rect x="38" y="84" width="26" height="43" rx="7" fill="#a5262b"/><circle cx="51" cy="73" r="5" fill="#eee"/></svg><div><strong>UTi260B</strong><p>256 × 192 • Тепловізор<br>Український довідник<br>Офлайн-матеріали</p></div></div>${categories.map(c=>button(...c)).join('')}<footer>Незалежний довідник • 1.0.0</footer>`}else if(page==='search'){main.innerHTML=back+`<h2>Пошук</h2><input class="search" type="search" aria-label="Пошук" placeholder="Наприклад, USB або перегрів" oninput="search(this.value)"><div id="results">${results()}</div>`}else if(page==='saved'){main.innerHTML=back+'<h2>Обране</h2>'+ (saved.length?articles.filter(a=>saved.includes(a[1])).map(article).join(''):'<p class="muted">Натисніть ☆ біля потрібної інструкції.</p>')}else if(page==='settings'){main.innerHTML=back+`<h2>Параметри</h2><section class="panel"><h3>Про програму</h3><p>Версія 1.0.0 • Українська мова</p><p>Незалежний довідник, не офіційний застосунок UNI-T. Основні матеріали працюють без мережі. Посилання відкриваються в браузері.</p><p>Ілюстрація тепловізора умовна. Фотографії реального меню ще не додано.</p><p><a href="${manual}">Джерело: посібник виробника UTi260B</a></p></section><button onclick="if(confirm('Очистити обране?')){saved=[];try{localStorage.removeItem('unit.saved')}catch(e){};go('saved')}">Очистити обране</button>`}else{let c=categories.find(c=>c[0]===page);main.innerHTML=back+`<h2>${esc(c?c[2]:'Довідник')}</h2>`+articles.filter(a=>a[0]===page).map(article).join('')+extras(page)}}
render();
</script></body></html>
