:root{color-scheme:light;--ink:#102c52;--blue:#075eac;--orange:#ec760c;--muted:#4d6380}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(145deg,#edf5fd,#dceafa);font:16px system-ui,sans-serif;min-height:100vh}header{padding:11px 12px;background:linear-gradient(120deg,#f9fcff,#d5e6f9);display:flex;align-items:center;gap:10px;border-bottom:1px solid #b5cce5;position:sticky;top:0;z-index:2;box-shadow:0 2px 7px #173c6914}header b{background:#d40019;color:white;border-radius:6px;padding:4px 8px;font-size:24px;letter-spacing:.3px;white-space:nowrap}header h1{font-size:15px;line-height:1.2;margin:0;font-weight:800}header small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.header-search{margin-left:auto!important;min-width:44px;min-height:44px;padding:0!important;background:transparent!important;box-shadow:none!important;border:0!important;font-size:24px!important;color:var(--blue)!important}main{max-width:700px;margin:auto;padding:10px 10px 94px}button,a.action{font:inherit;color:inherit;background:linear-gradient(150deg,#fff,#edf5fe);border:1px solid #bdd3ec;border-radius:13px;padding:12px;cursor:pointer;min-height:46px;text-decoration:none;box-shadow:0 3px 7px #214b7421}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ec760c;outline-offset:2px}.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;overflow:hidden;background:linear-gradient(125deg,#f8fcff 0%,#dcecff 53%,#a9c9f3 100%);border:1px solid #c0d8f4;border-radius:18px;padding:16px 13px;margin:0 0 10px;min-height:145px;box-shadow:0 4px 12px #285b8824}.hero svg{height:139px;width:107px;flex-shrink:0;filter:drop-shadow(4px 6px 5px #19334e44);order:2}.hero strong{font-size:32px;font-weight:900;letter-spacing:-1px;display:block;color:#073873}.hero p{font-size:13px;font-weight:600;line-height:1.35;margin:5px 0 8px}.hero .hero-tag{display:inline-block;padding:6px 10px;background:linear-gradient(#229bf0,#0757b0);color:white;border-radius:20px;font-size:11px;font-weight:800}.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 12px}.specs div{background:#f9fcff;border:1px solid #c3d9ef;border-radius:10px;padding:8px;text-align:center;font-size:11px;color:var(--muted)}.specs b{display:block;color:var(--ink);font-size:15px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{display:flex;align-items:center;gap:8px;text-align:left;width:100%;margin:0;font-weight:750;font-size:12px;line-height:1.25;padding:10px 8px;min-height:84px}.tile .tile-icon{width:37px;height:39px;flex:0 0 37px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#32a9ff,#034f9e);color:#fff;font-size:24px;box-shadow:inset 0 1px 2px #ffffff65}.tile.warm .tile-icon{background:linear-gradient(145deg,#ffad43,#d95700)}.tile .tile-label{min-width:0;flex:1;overflow-wrap:anywhere}.tile .tile-label small{display:block;font-weight:400;font-size:11px;line-height:1.3;color:var(--muted);margin-top:4px}.tile .arrow{font-size:20px;color:var(--orange);flex-shrink:0}.tile:last-child:nth-child(odd){grid-column:1/-1;min-height:65px}.search{width:100%;font:inherit;border-radius:12px;border:1px solid #a5bedb;background:#fff;color:var(--ink);padding:12px;margin-bottom:8px}nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(#fff,#e8f2ff);border-top:1px solid #b9d1eb;display:flex;justify-content:center;padding:6px 5px max(6px,env(safe-area-inset-bottom));gap:3px;box-shadow:0 -4px 14px #1f47751a;z-index:3}nav button{flex:1;max-width:160px;font-size:10px;background:transparent;border:0;padding:7px 2px;box-shadow:none;white-space:nowrap;border-radius:10px}nav button.active{background:linear-gradient(#2599ef,#0754ac);color:white}nav span{display:block;font-size:23px;line-height:1.1;margin-bottom:4px}h2{font-size:21px;margin:16px 0}h3{font-size:17px;margin:0 0 9px}.panel{background:linear-gradient(145deg,#fff,#f5f9ff);border:1px solid #bfd4ea;border-radius:14px;padding:15px;margin:10px 0;line-height:1.55;box-shadow:0 3px 10px #1b487315}.panel p{margin:7px 0}.panel ol{padding-left:22px;margin:8px 0}.panel li{margin:5px 0}.warn{border-left:4px solid #ec760c;background:#fff4e5}.red{background:#b92c31;color:white;border-color:#e44a4a}.star{float:right;padding:6px 10px;min-height:36px;color:#b95e00;margin-left:8px}a{color:#075eac;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:8px;border-bottom:1px solid #c8daee}th{background:#e1edfc}img.preview{width:100%;max-height:400px;object-fit:contain}input[type=file]{width:100%;color:var(--ink)}footer{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}button.back{font-size:14px}small{line-height:1.4}.meta,.muted{font-size:13px;color:var(--muted)}@media(max-width:350px){.tile{gap:5px;padding:8px 5px;font-size:11px}.tile .tile-icon{width:30px;flex-basis:30px;height:35px}.tile .arrow{display:none}.hero strong{font-size:28px}}

.hero{min-height:165px;padding:15px 12px;background:linear-gradient(122deg,#fff 0%,#e1effe 51%,#bed8f6 100%);gap:7px}.hero>div:first-of-type{flex:1;min-width:0;z-index:1}.hero strong{font-size:clamp(24px,8vw,37px)}.hero .product-photo{order:2;position:relative;width:40%;max-width:170px;height:160px;object-fit:contain;border-radius:10px;mix-blend-mode:multiply;flex-shrink:0}.hero-tag{border:0;box-shadow:0 3px 8px #0757b033;cursor:pointer;min-height:44px!important;font-size:12px!important}.specs{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.specs div{padding:8px 3px;font-size:10px;line-height:1.3}.specs b{font-size:12px;line-height:1.3;overflow-wrap:anywhere}.specs .symbol{display:block;font-size:21px;color:#075eac;margin-bottom:4px}.specs div:nth-child(odd) .symbol{color:#ec760c}.tile{min-height:90px;gap:8px}.tile .tile-label{font-size:12px;text-transform:none}.tile .tile-label small{font-size:11px}.guide-banner{display:flex;align-items:center;gap:10px;margin-top:10px;width:100%;text-align:left;min-height:76px}.guide-banner strong{font-size:36px;color:#e66f08;line-height:1}.guide-banner span{flex:1;font-size:15px;font-weight:750}.guide-banner small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px}.photo-gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-gallery figure{margin:0;padding:8px;background:#fff;border:1px solid #bdd3ec;border-radius:12px;text-align:center}.photo-gallery img{width:100%;height:190px;object-fit:contain}.photo-gallery figcaption{font-size:12px;color:var(--muted)}.photo-credit{font-size:11px;color:var(--muted);text-align:right;margin:4px 0 10px}@media(max-width:350px){.specs{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .product-photo{height:145px}.tile .tile-label{font-size:11px}}

const manual='https://storage.googleapis.com/uni-tdocuments/Thermal%20Camera%20User%20Manuals/UTi260B_User_Manual.pdf';
const categories=[['device','▣','ІНСТРУКЦІЯ КОРИСТУВАЧА'],['config','⚙','НАЛАШТУВАННЯ ПРИЛАДУ'],['electric','ϟ','ЕЛЕКТРОДІАГНОСТИКА'],['house','⌂','ОБСТЕЖЕННЯ БУДИНКІВ'],['floor','≋','ТЕПЛА ПІДЛОГА'],['reference','▤','ПРОФЕСІЙНИЙ ДОВІДНИК'],['photo','▧','ПЕРЕДАЧА ФОТО'],['fault','⚒','НЕСПРАВНОСТІ ПРИЛАДУ'],['video','▶','ОНЛАЙН-МАТЕРІАЛИ']];
// Each entry: category, stable ID, title, steps, note. Original practical guidance is not a substitute for the manufacturer manual.
const articles=[["device","d1","Підготовка до роботи",["Огляньте корпус, об’єктив і карту microSD.","Утримуйте кнопку живлення 3 секунди.","Після тривалої перерви або зміни середовища зачекайте 20 хвилин перед вимірюванням."],"Після вимкнення дочекайтеся 5–6 секунд. Не повторюйте швидко цикли увімкнення і вимкнення."],["device","d2","Кнопки та керування",["SET відкриває меню або підтверджує вибір; стрілки переміщують виділення.","Back повертає назад; на головному екрані запускає калібрування.","Replay відкриває галерею; курок захоплює кадр."],"На схемі виробника: кнопка живлення №11, Replay №16, Back №18, SET №19."],["device","d3","Паспортні характеристики",["ІЧ матриця — 256 × 192; дисплей — 2,8 дюйма, 320 × 240.","Видима камера — 640 × 480; зображення BMP на microSD.","Верхня межа — 550 °C; низька чутливість: 150…550 °C."],"У розділі характеристик нижня межа −20 °C, у розділі 9.5 — −15 °C. Звірте документацію своєї ревізії; не гарантуємо вимірювання нижче −15 °C."],["device","d4","Збереження та перегляд термограм",["Натисніть і відпустіть курок.","У ручному режимі стрілками виберіть зберегти або відхилити, підтвердьте SET; в автоматичному кадр збережеться сам.","Натисніть Replay, виберіть кадр стрілками та відкрийте через SET."],"Для запису потрібна microSD. Не виймайте карту під час перегляду або запису."],["config","c1","Коефіцієнт випромінювання (ε)",["SET → шестерня Settings → Measurements.","Виберіть Emissivity, натисніть SET, змініть значення стрілками вгору/вниз.","Підтвердьте SET і вийдіть Back."],"Значення 0,95 не універсальне; блискучі метали можуть давати значні похибки."],["config","c2","Температура середовища та відстань",["У Settings → Measurements виберіть Ambient Temp або Distance.","Натисніть SET, змініть параметр стрілками та збережіть SET.","Фіксуйте фактичну відстань і умови; ціль має займати достатню частину кадру."],"Не плутайте Distance з Alignment Distance, який налаштовує суміщення зображень."],["config","c3","Палітра і режим зображення",["Натисніть SET, стрілками ліворуч/праворуч виберіть Palette; SET відкриває список.","Виберіть палітру стрілками, підтвердьте SET.","У головному меню Image Mode оберіть Thermal, Digital, Fusion або PIP."],"Для порівняння використовуйте співставні температурні шкали; палітра не змінює температуру об’єкта."],["config","c4","USB Disk / USB Camera",["Відкрийте Settings → USB mode.","USB disk призначений для доступу до файлів на ПК, USB camera — для трансляції на ПК.","Виберіть режим стрілками і підтвердьте SET."],"Виробник не гарантує прямого USB-зв’язку з Android."],["config","c5","Автозбереження й автовимкнення",["Settings → System settings → Auto save: виберіть Yes або No і підтвердьте SET.","Для автовимкнення перейдіть назад до Settings → Auto power off.","Виберіть 5, 10, 30 хвилин або Off, натисніть SET."],"Виробник радить періодично очищувати карту після резервування, не накопичувати понад 1000 кадрів."],["electric","e1","Безпечне обстеження електрощита",["Оглядайте лише доступні зовні поверхні, не знімайте захист під напругою.","Зафіксуйте режим роботи і навантаження, якщо дані доступні безпечно.","Зробіть загальний і деталізований кадри з безпечної позиції."],"Внутрішнє обстеження під напругою — лише кваліфікованим персоналом із належними засобами захисту."],["electric","e2","Перегрів автоматів і контактів",["Зіставте однотипні компоненти за співставних струмів і охолодження.","Перевірте локальність аномалії, відблиски й контрольну точку.","Запишіть температуру, ΔT і навантаження."],"Не підтягувати під напругою. Допустимі температури визначає документація обладнання."],["electric","e3","Розетки, вилки і клеми",["Огляньте доступний корпус та місце входу кабелю.","Порівняйте з аналогічним навантаженим виробом.","Зафіксуйте деформацію, потемніння або аномальний нагрів."],"При запаху горіння, димі чи деформації припиніть використання і забезпечте безпечне відключення."],["house","h1","Підготовка будинку",["Запишіть температуру всередині і зовні, вітер, опади та вплив сонця.","Дочекайтеся сталого температурного перепаду, відповідного меті обстеження.","Не робіть висновок одразу після провітрювання або локального нагрівання."],"Одна термограма не визначає коефіцієнт теплопередачі."],["house","h2","Стіни, кути та містки холоду",["Зробіть загальний кадр та кадр холодної зони.","Зіставте з однотипною сусідньою ділянкою.","Перевірте геометрію, вологість та повітряні потоки незалежними методами."],"Холодна зона — спостереження, а не підтверджена причина дефекту."],["house","h3","Вікна і двері",["Огляньте примикання, укоси, ущільнення і нижню частину рами.","Врахуйте радіатор, конвекцію та відбиття на склі.","Прив’яжіть аномалію до звичайної фотографії."],"Звичайне скло не пропускає довгохвильове ІЧ випромінювання для такого вимірювання."],["floor","f1","Контури теплої підлоги",["Зафіксуйте початкову температуру поверхні.","Після запуску фіксуйте час і зміну температурного рисунка.","Порівнюйте сусідні контури за однакових умов."],"Рисунок залежить від покриття, глибини труб та часу роботи."],["floor","f2","Холодна ділянка",["Перевірте режим термостата та доступні показники системи.","Порівняйте ділянки з однаковим покриттям без меблів і килимів.","Передайте результати фахівцю для перевірки циркуляції або електричного контуру."],"Не визначайте місце витоку або обриву тільки за термограмою; не розкривайте підлогу без додаткової перевірки."],["reference","r1","Як читати термограму",["Знайдіть температурну шкалу, центральну точку та позначки мінімуму/максимуму.","Відокремлюйте межі шкали кадру від фактичних температур цілі.","Порівнюйте з видимим зображенням і записаними умовами."],"Автоматична шкала може змінювати колір навіть за незмінної температури."],["reference","r2","Різниця температур ΔT",["Визначте температуру зони інтересу.","Визначте температуру аналогічної контрольної ділянки за співставних умов.","Обчисліть ΔT = температура зони мінус контрольна температура."],"ΔT не є універсальним критерієм аварійності."],["reference","r3","Що записати у звіт",["Запишіть дату, місце, модель, умови, емісію і відстань.","Вкажіть номер кадру, об’єкт, температуру та контрольну точку.","Розділіть спостереження, ймовірну причину й рекомендовану перевірку."],"Не представляйте припущення як підтверджений дефект."],["photo","p1","Передача через ПК",["Установіть сумісне ПЗ UTi Thermal Analyzer для аналізу на ПК.","Підключіть кабель даних і виберіть USB disk для доступу до файлів.","Скопіюйте оригінали BMP на ПК, потім за потреби на телефон."],"Перед від’єднанням завершіть операції; для USB camera виробник вимагає закрити програму ПК до від’єднання."],["photo","p2","Передача через microSD / OTG",["Вимкніть тепловізор і вийміть карту після завершення запису.","Вставте microSD у сумісний кардридер телефона.","Скопіюйте файли через файловий менеджер і перевірте їх відкриття."],"Це альтернативний спосіб, який залежить від USB Host і підтримки файлової системи телефоном."],["photo","p3","Телефон не бачить тепловізор",["Перевірте USB disk і кабель, який підтримує дані.","Перевірте USB Host телефона зі справним сумісним пристроєм.","Якщо доступу немає, використайте ПК або кардридер."],"Робота заряджання не підтверджує передачу даних."],["fault","x1","Екран коротко засвічується і гасне",["Використайте сертифікований адаптер 5 В/1 А або 5 В/2 А та справний кабель.","Від’єднайте живлення перед спробою перезапуску; утримуйте кнопку живлення 3 секунди.","Якщо вимкнення повторюється, припиніть експлуатацію та зверніться до сервісу."],"Показник 99% не виключає несправність живлення; не розбирайте акумулятор."],["fault","x2","Не зберігаються фото",["Перевірте карту, у System settings → Device information перегляньте Capacity / Free.","Перевірте Auto save і спробуйте ручне збереження.","Перед форматуванням створіть перевірену резервну копію."],"Форматування видаляє дані. Не виймайте карту під час запису."],["fault","x3","Нестабільні покази температури",["Після зміни середовища витримайте час стабілізації.","З головного екрана Back запускає ручне калібрування; дочекайтеся завершення.","Звірте емісію, відстань, відбиття і контрольне вимірювання."],"За підозри на пошкодження припиніть відповідальні вимірювання."]];

cat":"reference","group":"Емісія, оптика та похибки","title":"Відблиск оператора","body":"Змініть кут огляду; аномалія, що рухається разом з відображенням, потребує перевірки."},{"id":"rec24","cat":"reference","group":"Емісія, оптика та похибки","title":"Мокра поверхня","body":"Фіксуйте наявність води: випаровування та зміна поверхневих властивостей впливають на термограму."},{"id":"rec25","cat":"reference","group":"Емісія, оптика та похибки","title":"Фарба і метал","body":"Не використовуйте однакову емісію для пофарбованої та оголеної ділянок без обґрунтування."},{"id":"rec26","cat":"reference","group":"Емісія, оптика та похибки","title":"Мала ціль","body":"Зменшуйте відстань лише в межах безпечного доступу, щоб ціль охоплювала достатньо пікселів."},{"id":"rec27","cat":"reference","group":"Емісія, оптика та похибки","title":"Змішаний піксель","body":"Не приймайте показ на межі двох різних поверхонь за температуру однієї з них."},{"id":"rec28","cat":"reference","group":"Емісія, оптика та похибки","title":"Кут спостереження","body":"Порівнюйте кадри за подібної геометрії; гострі кути можуть посилювати похибки."},{"id":"rec29","cat":"reference","group":"Емісія, оптика та похибки","title":"Фонове тепло","body":"Враховуйте відбиття від нагрівачів, сонця та інших гарячих предметів."},{"id":"rec30","cat":"reference","group":"Емісія, оптика та похибки","title":"Невизначеність емісії","body":"Якщо параметр не підтверджено, позначте результат як орієнтовний і перевірте іншим способом."},{"id":"rec31","cat":"electric","group":"Електрощити та захист","title":"Робоче навантаження","body":"Записуйте струм або режим роботи під час огляду; порівняння без навантаження обмежене."},{"id":"rec32","cat":"electric","group":"Електрощити та захист","title":"Однотипні автомати","body":"Зіставляйте однакові моделі за близьких струмів і умов охолодження."},{"id":"rec33","cat":"electric","group":"Електрощити та захист","title":"Фази","body":"Різницю температур між фазами оцінюйте разом із роз function mediaFor(id){const oldKeys=['MEAS','PALETTE','POINT','MODE','SETTINGS','LANG','UNIT','ALERT','SCALE','PARAMS'];if(instructionMedia[id])return instructionMedia[id].map(([key,label])=>({src:key==='front'?catalogFront:additionalManualMedia[key]||menuImages[oldKeys.indexOf(key)]?.src,label,kind:key==='front'?'Каталожне фото':'Ілюстрація виробника'}));if(practiceSchematics[id]){const [label,body]=practiceSchematics[id];const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190"><rect width="360" height="190" rx="12" fill="#f2f7fd"/><g font-family="sans-serif" font-size="12" fill="#17365d">'+body+'</g></svg>';return [{src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),label,kind:'Навчальна схема — не фото, не виміряна термограма'}]}return []}
function instructionFigures(id){return mediaFor(id).map(m=>'<figure class="instruction-figure"><img src="'+esc(m.src)+'" alt="'+esc(m.label)+'"><figcaption>'+esc(m.label)+'<small>'+esc(m.kind)+'</small></figcaption></figure>').join('')}
let page='home',query='',saved=[];try{saved=JSON.parse(localStorage.getItem('unit.saved')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){};const main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const descriptions={device:'Будова, характеристики',config:'Меню та режими роботи',electric:'Автомати, контакти, розетки',house:'Стіни, вікна, тепловтрати',floor:'Контури та нагрів',reference:'Матеріали, емісія, поради',photo:'Перегляд і копіювання',fault:'Причини та рішення',video:'Посібники та відео'};
const button=(id,icon,title)=>`<button class="tile ${['electric','floor','fault','video'].includes(id)?'warm':''}" onclick="go('${id}')"><span class="tile-icon">${icon}</span><span class="tile-label">${esc(title)}<small>${esc(descriptions[id]||'')}</small></span><span class="arrow" aria-hidden="true">›</span></button>`;
const back='<button class="back" onclick="go(\'home\')">← Головна</button>';
function article(a){return `<section class="panel"><button class="star" aria-label="Обране" onclick="toggle('${a[1]}',this)">${saved.includes(a[1])?'★':'☆'}</button><h3>${esc(a[2])}</h3>${instructionFigures(a[1])}<ol>${a[3].map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="meta">Важливо: ${esc(a[4])}</p></section>`}
function toggle(id,b){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem('unit.saved',JSON.stringify(saved))}catch(e){};if(page==='saved')render();else b.textContent=saved.includes(id)?'★':'☆'}
function go(p){page=p;query='';render();window.scrollTo(0,0)}
window.guideBack=()=>{if(page==='home')exitGuide();else go('home')};
function exitGuide(){if(window.GuideApp)GuideApp.exit();else go('home')}
function search(v){query=v;document.getElementById('results').innerHTML=results()}
function results(){let q=query.trim().toLocaleLowerCase('uk');let m=allArticles.filter(a=>a.slice(2).flat().join(' ').toLocaleLowerCase('uk').includes(q));return `<p class="meta">Знайдено: ${m.length}</p>`+m.map(article).join('')}
function extras(p){if(p==='config')return '<section class="panel"><h3>Оригінальні зображення меню UTi260B</h3><p class="meta">Ілюстрації з посібника виробника (стор. 7–14). Мова меню залежить від прошивки.</p><div class="photo-gallery">'+menuImages.map(m=>'<figure><img src="'+m.src+'" alt="'+esc(m.label)+'"><figcaption>'+esc(m.label)+'</figcaption></figure>').join('')+'</div><p><a href="'+manual+'">Оригінальний посібник</a></p></section>';if(p==='device')return `<section class="panel"><h3>Зовнішній вигляд UTi260B</h3><div class="photo-gallery"><figure><img src="__UTI260B_FRONT_DATA__" alt="Дисплей, кнопки керування, рукоятка"><figcaption>Дисплей і керування</figcaption></figure><figure><img src="__UTI260B_REAR_DATA__" alt="Об'єктив і корпус тепловізора"><figcaption>Об'єктив і корпус</figcaption></figure></div><p class="meta">Каталожні фотографії з паспортного листа UTi260B. <a href="https://uni-tnm.com/product/meter/html/UTi260B.html">Джерело</a>. Зображення можуть відрізнятися для окремих ревізій.</p></section>`;if(p==='reference')return `<section class="panel"><h3>Орієнтовна випромінювальна здатність</h3><table><tr><th>Поверхня</th><th>ε</th></tr>${[['Фарбована поверхня','0,90'],['Гума','0,95'],['ПВХ','0,93'],['Бетон','0,97'],['Окиснена мідь','0,78'],['Мідна пластина','0,06']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table><p class="meta">Орієнтири з посібника UTi260B. Фактичне значення залежить від стану, покриття та температури поверхні.</p></section>`;if(p==='photo')return `<section class="panel"><h3>Перегляд фотографії</h3><p>Виберіть файл, доступний у системному сховищі телефону. Це перегляд зображення, не аналіз радіометричних даних.</p><input type="file" accept="image/*,.bmp" onchange="preview(this)"><p id="fileinfo" class="meta"></p><img id="preview" class="preview" alt="Попередній перегляд" hidden></section>`;if(p==='video')return `<section class="panel"><h3>Документація виробника</h3><p><a href="${manual}">Оригінальна інструкція UTi260B (PDF, англійською)</a></p><p><a href="https://uni-tnm.com/product/meter/html/UTi260B.html">Паспорт і документація приладу</a></p><p><a href="https://www.youtube.com/watch?v=Bj6bNuhREtU">Відео: огляд UTi260B</a></p><p class="meta">Для відкриття посилань потрібен інтернет.</p></section>`;return ''}
let objUrl=null;function preview(input){let f=input.files[0];if(!f)return;if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(f);let img=document.getElementById('preview');img.hidden=false;img.onerror=()=>{img.hidden=true;document.getElementById('fileinfo').textContent='Не вдалося відкрити формат зображення. Збережіть оригінал; спробуйте перегляд на ПК.'};document.getElementById('fileinfo').textContent=f.name+' • '+Math.round(f.size/1024)+' КБ';img.src=objUrl}
function render(){document.querySelectorAll('nav button').forEach((b,i)=>{let active=['home','search','saved','settings','exit'][i]===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}if(page==='home'){main.innerHTML=`<div class="hero"><img class="product-photo" src="__UTI260B_FRONT_DATA__" alt="UNI-T UTi260B — каталожне фото з боку дисплея"><div><strong>UTi260B</strong><p>Професійний тепловізор<br>Український довідник</p><button class="hero-tag" onclick="go('device')">Інтерактивний довідник ›</button></div></div><p class="photo-credit">Фото: <a href="https://uni-tnm.com/product/meter/html/UTi260B.html">каталог UTi260B</a></p><div class="specs"><div><span class="symbol">♨</span><b>до 550 °C</b>Верхня межа</div><div><span class="symbol">⊕</span><b>256 × 192</b>ІЧ роздільність</div><div><span class="symbol">▰</span><b>≥ 6 год</b>За паспортом</div><div><span class="symbol">▣</span><b>USB-C</b>Фото / microSD</div></div><div class="tiles">${categories.map(c=>button(...c)).join('')}</div><button class="guide-banner" onclick="go('recommendations')"><strong>${recommendations.length}</strong><span>Професійних рекомендацій<small>Практичні поради • 10 тематичних груп</small></span><b aria-hidden="true">›</b></button><footer>Незалежний довідник • 1.0.0</footer>` }else if(page==='recommendations'){main.innerHTML=back+'<h2>100 професійних рекомендацій</h2><p class="muted">Практичні поради, не заміна паспорта чи професійної діагностики.</p>'+[...new Set(recommendations.map(r=>r.group))].map(g=>'<details class="panel"><summary>'+esc(g)+' • 10</summary>'+recommendations.filter(r=>r.group===g).map(r=>article(recommendationArticles.find(a=>a[1]===r.id))).join('')+'</details>').join('');}else if(page==='search'){main.innerHTML=back+`<h2>Пошук</h2><input class="search" type="search" aria-label="Пошук" placeholder="Наприклад, USB або перегрів" oninput="search(this.value)"><div id="results">${results()}</div>`}else if(page==='saved'){main.innerHTML=back+'<h2>Обране</h2>'+ (saved.length?allArticles.filter(a=>saved.includes(a[1])).map(article).join(''):'<p class="muted">Натисніть ☆ біля потрібної інструкції.</p>')}else if(page==='settings'){main.innerHTML=back+`<h2>Параметри</h2><section class="panel"><h3>Про програму</h3><p>Версія 1.0.0 • Українська мова</p><p>Незалежний довідник, не офіційний застосунок UNI-T. Основні матеріали працюють без мережі. Посилання відкриваються в браузері.</p><p>Каталожні фотографії приладу взяті з паспортного листа UTi260B. Зображення меню — ілюстрації з офіційного посібника; не знімки з вашого екземпляра. Практичні схеми позначено окремо.</p><p><a href="${manual}">Джерело: посібник виробника UTi260B</a></p></section><button onclick="if(confirm('Очистити обране?')){saved=[];try{localStorage.removeItem('unit.saved')}catch(e){};go('saved')}">Очистити обране</button>`}else{let c=categories.find(c=>c[0]===page);main.innerHTML=back+`<h2>${esc(c?c[2]:'Довідник')}</h2>`+articles.filter(a=>a[0]===page).map(article).join('')+extras(page)+((recommendationArticles.some(a=>a[0]===page))?'<details class="panel"><summary>Практичні рекомендації</summary>'+recommendationArticles.filter(a=>a[0]===page).map(article).join('')+'</details>':'')}}
render();
</script></body></html>
