name: Build UNI-T Guide APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Embed verified-model catalog photos
        run: |
          python3 -m pip install --disable-pip-version-check 'PyMuPDF==1.25.5'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 'https://damoatool02.cafe24.com/pdf//Uni-T/Product%20Flyer--UTi260B.pdf' -o /tmp/uti260b-flyer.pdf
          python3 scripts/embed_catalog_photos.py /tmp/uti260b-flyer.pdf app/src/main/assets/index.html
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 'https://storage.googleapis.com/uni-tdocuments/Thermal%20Camera%20User%20Manuals/UTi260B_User_Manual.pdf' -o /tmp/uti260b-manual.pdf
          python3 scripts/embed_menu_photos.py /tmp/uti260b-manual.pdf app/src/main/assets/index.html
          python3 -c "import pathlib,re; h=pathlib.Path('app/src/main/assets/index.html').read_text(); pathlib.Path('/tmp/guide-check.js').write_text(re.search(r'<script>(.*?)</script>',h,re.S).group(1))"
          node --check /tmp/guide-check.js
      - name: Visual browser smoke test
        run: |
          npm install --prefix /tmp/guide-test --no-audit --no-fund playwright@1.51.1
          /tmp/guide-test/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/guide-test/node_modules node scripts/check_guide.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-visual-check
          path: visual-check/
          if-no-files-found: warn
      - name: Build debug APK and lint
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UNI-T-Guide-1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UNI-T-Guide-1.0.0-debug
          path: UNI-T-Guide-1.0.0-debug.apk
          if-no-files-found: error
