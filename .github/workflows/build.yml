name: Build UNI-T Guide APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build debug APK and lint
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UNI-T-Guide-1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UNI-T-Guide-1.0.0-debug
          path: UNI-T-Guide-1.0.0-debug.apk
          if-no-files-found: error
